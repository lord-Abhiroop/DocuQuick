<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0369A1" flood-opacity="0.4"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Squircle Base with Shadow -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Document Sheet -->
  <path d="M160 120 C160 106.7 170.7 96 184 96 L296 96 L352 152 L352 392 C352 405.3 341.3 416 328 416 L184 416 C170.7 416 160 405.3 160 392 Z" fill="#FFFFFF" filter="url(#cardShadow)"/>

  <!-- Folded Corner -->
  <path d="M296 96 L352 152 L312 152 C296 152 296 152 296 136 Z" fill="url(#foldGrad)"/>

  <!-- Document Accent Lines -->
  <!-- Header / Badge Bar (Red for PDF accent) -->
  <rect x="196" y="180" width="120" height="16" rx="8" fill="#EF4444"/>
  
  <!-- Content Lines -->
  <rect x="196" y="224" width="100" height="12" rx="6" fill="#0284C7" fill-opacity="0.6"/>
  <rect x="196" y="256" width="120" height="12" rx="6" fill="#94A3B8" fill-opacity="0.8"/>
  <rect x="196" y="288" width="110" height="12" rx="6" fill="#94A3B8" fill-opacity="0.8"/>
  <rect x="196" y="320" width="80" height="12" rx="6" fill="#94A3B8" fill-opacity="0.8"/>

  <!-- Fast Lightning / Quick Bolt (Speed Accent in gold/cyan) -->
  <circle cx="344" cy="356" r="42" fill="#0F172A" filter="url(#cardShadow)"/>
  <path d="M348 326 L326 358 L344 358 L340 386 L362 354 L344 354 Z" fill="#38BDF8"/>
</svg>